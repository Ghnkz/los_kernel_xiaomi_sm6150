name: Start Reforge

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'MIUI-OOS'
        type: choice
        options:
          - MIUI-OOS
          - AOSP

      compiler:
        description: 'Select Compiler'
        required: true
        default: 'AOSP-Clang'
        type: choice
        options:
          - AOSP-Clang
          - Neutron-Clang

env:
  TELEGRAM_BOT_TOKEN: "8843798051:AAHHSmDioK63hm5xdlgaUm355te88WNGH1s"
  TELEGRAM_CHAT_ID: "-1002531162824"

jobs:
  Reforging:
    runs-on: ubuntu-latest

    steps:
    - name: 📨 Notify - Workflow Started
      shell: bash
      run: |
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="🚀 *Reforge Kernel — Workflow Started*
        📦 Build type: \`${{ github.event.inputs.build_type }}\`
        ⚙️ Compiler: \`${{ github.event.inputs.compiler }}\`
        🌿 Branch: \`${{ github.ref_name }}\`
        👤 By: \`${{ github.actor }}\`
        🔗 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    - name: 🔄 Checkout Code
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 1

    - name: 📨 Notify - Checkout Done
      if: always()
      shell: bash
      run: |
        STATUS="✅ success"
        if [ "${{ job.status }}" != "success" ] && [ "${{ steps.checkout.outcome }}" == "failure" ]; then STATUS="❌ failed"; fi
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="🔄 *Checkout Code* step finished"

    - name: ⏰ Prepare timezone
      run: |
        sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    - name: 📨 Notify - Timezone Set
      if: always()
      shell: bash
      run: |
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="⏰ *Prepare timezone* step finished"

    - name: 🥷 Implant NoMount
      run: curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -

    - name: 📨 Notify - NoMount Implanted
      if: always()
      shell: bash
      run: |
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="🥷 *Implant NoMount* step finished"

    - name: 📥 Setup KernelSU
      run: curl -LSs "https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main

    - name: 📨 Notify - KernelSU Setup Done
      if: always()
      shell: bash
      run: |
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="📥 *Setup KernelSU* step finished"

    - name: 📦 Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc \
          cpio \
          flex \
          bison \
          git \
          python-is-python3 \
          tar \
          aria2 \
          perl \
          wget \
          curl \
          lz4 \
          libssl-dev \
          libelf-dev \
          dwarves \
          zip \
          zstd

    - name: 📨 Notify - Dependencies Installed
      if: always()
      shell: bash
      run: |
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="📦 *Install Dependencies* step finished"

    - name: ⚙️ Setup Environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"
        echo "BUILD_DATE=\"$(TZ=Asia/Jakarta date '+%b %d %Y')\"" >> "$GITHUB_ENV"

    - name: 📨 Notify - Environment Ready
      if: always()
      shell: bash
      run: |
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="⚙️ *Setup Environment* step finished
        📅 Build date: \`$BUILD_DATE\`"

    - name: 🔧 Setup Compiler
      shell: bash
      run: |
        set -e

        mkdir -p clang

        if [[ "${{ github.event.inputs.compiler }}" == "Neutron-Clang" ]]; then

          echo "Using Neutron Clang"

          CLANG_URL=$(
            curl -fsSL \
              https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest |
            grep "browser_download_url" |
            grep "neutron-clang" |
            head -n 1 |
            cut -d '"' -f 4
          )

          echo "Downloading:"
          echo "$CLANG_URL"

          curl -L "$CLANG_URL" -o neutron-clang.tar.zst
          tar -C clang -xf neutron-clang.tar.zst
          rm -f neutron-clang.tar.zst

        else

          echo "Using AOSP Clang"

          CLANG_URL=$(
            curl -fsSL \
              https://api.github.com/repos/bachnxuan/aosp_clang_mirror/releases/latest |
            grep "browser_download_url" |
            grep -E 'clang-.*\.tar\.gz' |
            head -n 1 |
            cut -d '"' -f 4
          )

          echo "Downloading:"
          echo "$CLANG_URL"

          curl -L "$CLANG_URL" -o clang.tar.gz
          tar -C clang -xf clang.tar.gz
          rm -f clang.tar.gz

        fi

        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"

        echo
        echo "Compiler:"
        "$GITHUB_WORKSPACE/clang/bin/clang" --version | head -n 1
        "$GITHUB_WORKSPACE/clang/bin/ld.lld" --version | head -n 1

    - name: 📨 Notify - Compiler Ready
      if: always()
      shell: bash
      run: |
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="🔧 *Setup Compiler* step finished
        ⚙️ Compiler: \`${{ github.event.inputs.compiler }}\`"

    - name: 📱 Patch Panel Dimensions
      shell: bash
      run: |
        set -e

        apply_panel_dimensions() {
            local w="$1"
            local h="$2"

            local files=(
                "arch/arm64/boot/dts/qcom/xiaomi/sweet/dsi-panel-k6-38-0e-0b-fhd-dsc-video.dtsi"
                "arch/arm64/boot/dts/qcom/xiaomi/sweet/dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi"
            )

            for f in "${files[@]}"; do
                if [[ -f "$f" ]]; then

                    echo "Patching $f → ${w}x${h}"

                    sed -i \
                      "s/\(qcom,mdss-pan-physical-width-dimension[[:space:]]*=[[:space:]]*< *\)[0-9]\+/\1${w}/" \
                      "$f"

                    sed -i \
                      "s/\(qcom,mdss-pan-physical-height-dimension[[:space:]]*=[[:space:]]*< *\)[0-9]\+/\1${h}/" \
                      "$f"
                fi
            done
        }

        if [[ "${{ github.event.inputs.build_type }}" == "AOSP" ]]; then
            apply_panel_dimensions 69 156
        else
            apply_panel_dimensions 695 1546
        fi

    - name: 📨 Notify - Panel Dimensions Patched
      if: always()
      shell: bash
      run: |
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="📱 *Patch Panel Dimensions* step finished"

    - name: 🛠️ Build Kernel
      shell: bash
      run: |
        set -e

        export ARCH=arm64
        export SUBARCH=arm64

        export KBUILD_BUILD_USER=Ghnkz
        export KBUILD_BUILD_HOST=LineageOS

        export PATH="$CLANG_PATH/bin:$PATH"

        export LLVM=1
        export LLVM_IAS=1

        export CC=clang
        export LD=ld.lld

        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

        export KBUILD_COMPILER_STRING="$(clang --version | head -n1)"

        echo "========================================="
        echo "       Reforge Kernel Compilation"
        echo "========================================="
        echo "Build type : ${{ github.event.inputs.build_type }}"
        echo "Compiler   : ${{ github.event.inputs.compiler }}"
        echo "Date       : $BUILD_DATE"
        echo "Jobs       : $(nproc --all)"
        echo
        clang --version | head -n1
        echo "========================================="

        make O=out ARCH=arm64 vendor/sweet_defconfig

        make \
          -j"$(nproc --all)" \
          O=out \
          ARCH=arm64

        cp out/.config out/sweet_defconfig.txt

    - name: 📨 Notify - Kernel Build Finished
      if: always()
      shell: bash
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          TEXT="🛠️ *Build Kernel* step finished — ✅ compilation succeeded so far"
        else
          TEXT="🛠️ *Build Kernel* step finished — ❌ compilation FAILED"
        fi
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="$TEXT"

    - name: ✅ Verify Kernel Build
      shell: bash
      run: |
        set -e

        KERNEL="out/arch/arm64/boot/Image.gz"
        DTBO="out/arch/arm64/boot/dtbo.img"
        DTB="out/arch/arm64/boot/dtb.img"

        failed=0

        for file in "$KERNEL" "$DTBO" "$DTB"; do
          if [[ ! -f "$file" ]]; then
            echo "❌ Missing: $file"
            failed=1
          else
            echo "✅ Found: $file"
            ls -lh "$file"
          fi
        done

        if [[ "$failed" -ne 0 ]]; then
          echo "Kernel compilation failed."
          exit 1
        fi

    - name: 📨 Notify - Verify Result
      if: always()
      shell: bash
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          TEXT="✅ *Verify Kernel Build* step finished — all output files found"
        else
          TEXT="❌ *Verify Kernel Build* step FAILED — one or more output files missing"
        fi
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="$TEXT"

    - name: 💾 Upload configs
      uses: actions/upload-artifact@v5
      with:
        name: configs-${{ env.BUILD_TIME }}
        path: out/sweet_defconfig.txt

    - name: 📨 Notify - Config Uploaded
      if: always()
      shell: bash
      run: |
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="💾 *Upload configs* step finished"

    - name: 📂 Clone AnyKernel3 & Zip
      shell: bash
      run: |
        set -e

        git clone \
          --depth=1 \
          https://github.com/MiDoNaSR545/Anykernel3.git \
          AnyKernel3

        cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
        cp out/arch/arm64/boot/dtb.img AnyKernel3/dtb.img

        cd AnyKernel3

        zip -r9 \
          "../Reforge-sweet2-${{ github.ref_name }}-${{ env.BUILD_TIME }}.zip" \
          . \
          -x ".git/*"

    - name: 📨 Notify - AnyKernel3 Zip Ready
      if: always()
      shell: bash
      run: |
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="📂 *Clone AnyKernel3 & Zip* step finished — flashable zip created"

    - name: 📤 Upload Flashable Zip
      uses: actions/upload-artifact@v5
      with:
        name: Reforge-sweet2-${{ github.ref_name }}-${{ env.BUILD_TIME }}
        path: Reforge-sweet2-${{ github.ref_name }}-${{ env.BUILD_TIME }}.zip

    - name: 📨 Notify - Zip Uploaded to Artifacts
      if: always()
      shell: bash
      run: |
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="📤 *Upload Flashable Zip* step finished — zip uploaded as GitHub Actions artifact"

    - name: 📨 Kirim ke Telegram
      shell: bash
      run: |
        set -e

        ZIP_FILE="Reforge-sweet2-${{ github.ref_name }}-${{ env.BUILD_TIME }}.zip"

        CAPTION="🛠️ *Reforge Kernel Build*
        📦 Build type: \`${{ github.event.inputs.build_type }}\`
        ⚙️ Compiler: \`${{ github.event.inputs.compiler }}\`
        🌿 Branch: \`${{ github.ref_name }}\`
        📅 Date: \`$BUILD_DATE\`
        👤 By: \`${{ github.actor }}\`"

        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
          -F chat_id="${TELEGRAM_CHAT_ID}" \
          -F document=@"${ZIP_FILE}" \
          -F caption="${CAPTION}" \
          -F parse_mode="Markdown"

    - name: 📨 Notify - Workflow Finished
      if: always()
      shell: bash
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          TEXT="🎉 *Reforge Kernel — Workflow Finished Successfully* 🎉
        📦 Build type: \`${{ github.event.inputs.build_type }}\`
        ⚙️ Compiler: \`${{ github.event.inputs.compiler }}\`"
        else
          TEXT="⚠️ *Reforge Kernel — Workflow Finished With Errors* ⚠️
        Check the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
        curl -sS -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d parse_mode="Markdown" \
          -d text="$TEXT"